name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0 (or 2.1.0-rc1 for pre-releases)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release (only published on GitHub, not in TER)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      -
        name: Validate version
        run: |
          # TER only accepts x.y.z, pre-releases (which aren't published to TER) may have a suffix
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "${IS_PRERELEASE}" = 'true' ]; then
            pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          fi
          if ! [[ "${RELEASE_VERSION}" =~ ${pattern} ]]; then
            echo "::error::\"${RELEASE_VERSION}\" is not a valid version."
            exit 1
          fi

      -
        name: Check that release and tag don't exist yet
        run: |
          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::A release (or draft) for ${RELEASE_VERSION} already exists."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_VERSION} already exists."
            exit 1
          fi

      -
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      -
        name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.4
          extensions: intl, mbstring, zip
          tools: composer:v2

      -
        name: Install tailor
        run: composer global require typo3/tailor:^2.1 --prefer-dist --no-progress

      -
        name: Check version in ext_emconf.php
        run: |
          # tailor ignores a mismatch here as long as composer.json declares the version
          # shellcheck disable=SC2016 # PHP variables, not shell expressions
          emconfVersion="$(php -r '$_EXTKEY = "vite_asset_collector"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')"
          if [ "${emconfVersion}" != "${RELEASE_VERSION}" ]; then
            echo "::error::ext_emconf.php declares version ${emconfVersion}, expected ${RELEASE_VERSION}. Run \"composer set-version ${RELEASE_VERSION}\" and push the change first."
            exit 1
          fi

      -
        name: Check version in composer.json
        run: |
          # Runs the same validation as the publish workflow
          if ! "$(composer global config bin-dir --absolute --quiet)/tailor" create-artefact "${RELEASE_VERSION}"; then
            echo "::error::composer.json doesn't declare version ${RELEASE_VERSION}. Run \"composer set-version ${RELEASE_VERSION}\" and push the change first."
            exit 1
          fi

  draft:
    name: Create draft release ${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      -
        name: Create draft release
        run: |
          # The tag is created at the validated commit once the draft is published
          options=()
          if [ "${IS_PRERELEASE}" = 'true' ]; then
            options+=(--prerelease)
          fi
          gh release create "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_VERSION}" \
            --generate-notes \
            "${options[@]}"
          echo "Draft created: $(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
