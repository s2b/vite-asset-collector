name: publish

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      -
        name: Validate version
        run: |
          # TER only accepts x.y.z, pre-releases (which aren't published to TER) may have a suffix
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "${IS_PRERELEASE}" = 'true' ]; then
            pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          fi
          if ! [[ "${RELEASE_VERSION}" =~ ${pattern} ]]; then
            echo "::error::Release tag \"${RELEASE_VERSION}\" is not a valid version."
            exit 1
          fi

      -
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      -
        name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.4
          extensions: intl, mbstring, zip
          tools: composer:v2

      -
        name: Install tailor
        run: composer global require typo3/tailor:^2.1 --prefer-dist --no-progress

      -
        name: Check version in ext_emconf.php
        run: |
          # tailor ignores a mismatch here as long as composer.json declares the version
          # shellcheck disable=SC2016 # PHP variables, not shell expressions
          emconfVersion="$(php -r '$_EXTKEY = "vite_asset_collector"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')"
          if [ "${emconfVersion}" != "${RELEASE_VERSION}" ]; then
            echo "::error::ext_emconf.php declares version ${emconfVersion}, expected ${RELEASE_VERSION}."
            exit 1
          fi

      -
        name: Download artefact from release
        # Created and attached to the draft by the prepare release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern '*.zip' --dir ter-artefact
          artefacts=(ter-artefact/*.zip)
          if [ "${#artefacts[@]}" -ne 1 ] || [ ! -f "${artefacts[0]}" ]; then
            echo "::error::Expected exactly one ZIP file attached to release ${RELEASE_VERSION}."
            exit 1
          fi

      -
        name: Publish to TER
        # Pre-releases are only published on GitHub
        if: ${{ !github.event.release.prerelease }}
        run: |
          artefacts=(ter-artefact/*.zip)
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --artefact="${artefacts[0]}" \
            --comment="Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_VERSION}" \
            "${RELEASE_VERSION}"
