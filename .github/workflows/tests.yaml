name: tests

on: [ push, pull_request ]

jobs:
  lint:
    name: Source code linting
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      -
        name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.4
          extensions: intl, mbstring, pdo_sqlite, zip
          ini-file: development

      -
        name: Validate composer.json
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      -
        name: Cache composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-

      -
        name: Install composer dependencies
        run: composer install --prefer-dist --no-progress

      -
        name: PHP Linting
        run: composer lint:php

      -
        name: Editorconfig Linting
        run: composer lint:editorconfig


  package:
    name: TER packaging
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      -
        name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.4
          extensions: intl, mbstring, zip
          tools: composer:v2

      -
        name: Install tailor
        run: composer global require typo3/tailor:^2.1 --prefer-dist --no-progress

      -
        name: Create artefact
        run: |
          # Same validation and packaging as in the publish workflow, using the
          # version that is currently declared in composer.json
          version="$(jq -r '.extra["typo3/cms"].version' composer.json)"
          # tailor ignores a mismatch in ext_emconf.php as long as composer.json declares the version
          # shellcheck disable=SC2016 # PHP variables, not shell expressions
          emconfVersion="$(php -r '$_EXTKEY = "vite_asset_collector"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')"
          if [ "${emconfVersion}" != "${version}" ]; then
            echo "::error::ext_emconf.php declares version ${emconfVersion}, composer.json declares ${version}."
            exit 1
          fi
          "$(composer global config bin-dir --absolute --quiet)/tailor" create-artefact "${version}"

      -
        name: Check artefact contents
        run: |
          artefacts=(tailor-version-artefact/*.zip)
          unzip -Z1 "${artefacts[0]}"
          unexpected="$(unzip -Z1 "${artefacts[0]}" | grep -vE '^(Classes|Configuration|Documentation|Resources)/|^(composer\.json|ext_conf_template\.txt|ext_emconf\.php|ext_localconf\.php|LICENSE|README\.md)$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::Unexpected files in TER artefact:"
            echo "${unexpected}"
            exit 1
          fi

  test:
    name: Testing (PHP ${{ matrix.php-version }}, TYPO3 ^${{ matrix.typo3-version }})
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php-version: [8.5, 8.4, 8.3, 8.2]
        typo3-version: [14, 13]

    uses: ./.github/workflows/_test.yaml
    with:
      php-version: ${{ matrix.php-version }}
      typo3-version: ^${{ matrix.typo3-version }}
      unit-coverage-name: coverage-unit-${{ matrix.php-version }}-^${{ matrix.typo3-version }}
      functional-coverage-name: coverage-functional-${{ matrix.php-version }}-^${{ matrix.typo3-version }}
      phpstan-config: 'Build/CodeQuality/phpstan${{ matrix.typo3-version }}.neon'

  test-doc:
    name: Test documentation rendering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Test if the documentation will render without warnings
        run: |
          mkdir -p Documentation-GENERATED-temp \
          && docker run --rm --pull always -v $(pwd):/project \
             ghcr.io/typo3-documentation/render-guides:latest --config=Documentation --no-progress --fail-on-log
